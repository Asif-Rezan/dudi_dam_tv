name: Clean published song media from Drive
on:
  workflow_run:
    workflows: [Hindi music generation and public publishing, Hindi album music generation and public publishing]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Exact successfully published song run ID (cleanup only; never uploads)
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: heart-and-mind-drive-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
    steps:
      # Always execute trusted default-branch code, never code from the source artifact.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Identify completed song
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: music-output-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: completed-song/
      - name: Verify public HD upload and clean only its Drive media
        env:
          REQUESTED_RUN_ID: ${{ inputs.run_id }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          run_id = os.getenv('REQUESTED_RUN_ID', '')
          if not run_id:
              candidates = list(Path('completed-song').glob('*/song.json'))
              if len(candidates) != 1:
                  raise RuntimeError('Expected exactly one completed song identity')
              run_id = candidates[0].parent.name
          if not re.fullmatch(r'[a-zA-Z0-9_-]{1,80}', run_id):
              raise ValueError('Invalid completed song identity')
          subprocess.run(['python', 'cleanup_drive.py', '--run-id', run_id], check=True)
          PY
