name: Hindi album music generation and public publishing
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Stable run ID; reuse it to resume an interrupted song
        required: true
        type: string
      vocal_gender:
        description: Voice for a NEW song only; auto follows the daily male/female rotation
        required: false
        default: auto
        type: choice
        options:
          - auto
          - male
          - female
      prepared_run:
        description: Optional previous GitHub run ID containing saved lyrics or music
        required: false
        type: string
  schedule:
    - cron: '0 21 * * *' # 03:00 Asia/Dhaka (next local day)
permissions:
  contents: read
  actions: read
concurrency:
  group: heart-and-mind-publish
  cancel-in-progress: false
jobs:
  lyrics:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      run_id: ${{ steps.identity.outputs.run_id }}
      restore_artifacts: ${{ steps.recovery.outputs.artifact_names || '[]' }}
    env:
      LYRICS_MODEL: Qwen/Qwen3-4B-Instruct-2507
      OMP_NUM_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      REQUESTED_RUN_ID: ${{ inputs.run_id }}
      REQUESTED_VOCAL_GENDER: ${{ inputs.vocal_gender || 'auto' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - id: identity
        shell: bash
        run: |
          RUN_ID="${REQUESTED_RUN_ID:-daily-$(TZ=Asia/Dhaka date +%F)}"
          [[ "$RUN_ID" =~ ^[a-zA-Z0-9_-]{1,80}$ ]] || exit 1
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - run: pip install -r requirements.txt -r requirements-lyrics.txt
      - run: python -m unittest -v
      - name: Find available recovery checkpoints
        id: recovery
        if: inputs.prepared_run != ''
        uses: actions/github-script@v7
        env:
          PREPARED_RUN_ID: ${{ inputs.prepared_run }}
        with:
          script: |
            const saved = process.env.PREPARED_RUN_ID;
            if (!/^\d+$/.test(saved) || !Number.isSafeInteger(Number(saved))) {
              throw new Error('prepared_run must be a numeric GitHub run ID');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner, repo: context.repo.repo,
              run_id: Number(saved), per_page: 100
            });
            const names = artifacts.filter(a => !a.expired).map(a => a.name);
            const music = `generated-music-${saved}`;
            const lyrics = `music-input-${saved}`;
            const selected = names.includes(music) ? music : names.includes(lyrics) ? lyrics : null;
            if (!selected) {
              throw new Error('No unexpired lyrics or music checkpoint is available for prepared_run');
            }
            core.setOutput('artifact_name', selected);
            core.setOutput('artifact_names', JSON.stringify(names));
            core.info(selected === music ? 'Restoring saved music checkpoint.' : 'Restoring saved lyrics draft.');
      - name: Restore available lyrics or music checkpoint
        if: inputs.prepared_run != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.recovery.outputs.artifact_name }}
          run-id: ${{ inputs.prepared_run }}
          github-token: ${{ github.token }}
          path: output/
      - name: Generate original Hindi lyrics and verify uniqueness
        env:
          SONG_RUN_ID: ${{ steps.identity.outputs.run_id }}
          DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python -u prepare_music.py --run-id "$SONG_RUN_ID" --stage lyrics --check-history --vocal-gender "$REQUESTED_VOCAL_GENDER"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-input-${{ github.run_id }}
          path: output/
          retention-days: 7
  music:
    needs: lyrics
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      SONG_RUN_ID: ${{ needs.lyrics.outputs.run_id }}
      ACESTEP_SOURCE_DIR: ${{ github.workspace }}/.vendor/ace-step
      ACESTEP_CHECKPOINTS_DIR: .models/acestep
      ACESTEP_INIT_LLM: 'false'
      ACESTEP_GENERATION_TIMEOUT: '18000'
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ace-step/ACE-Step-1.5
          ref: ca1e85fe9430179831e6bc6be790c332190a3866
          path: .vendor/ace-step
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Prepare CPU runner memory and audio tools
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1
          sudo fallocate -l 16G /swapfile-music
          sudo chmod 600 /swapfile-music
          sudo mkswap /swapfile-music
          sudo swapon /swapfile-music
          free -h
          df -h .
      - name: Install CPU-only music inference runtime
        run: |
          pip install --no-cache-dir torch==2.10.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt -r requirements-music-cpu.txt
      - name: Verify pinned ACE-Step CPU imports
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from music_cpu import runtime
          torch, handler, params, config, infer = runtime(Path(os.environ['ACESTEP_SOURCE_DIR']))
          assert not torch.cuda.is_available()
          print('Pinned ACE-Step CPU runtime imported successfully')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: music-input-${{ github.run_id }}
          path: output/
      - name: Generate full Hindi song with ACE-Step on GitHub CPU
        run: python -u prepare_music.py --run-id "$SONG_RUN_ID" --stage music
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-music-${{ github.run_id }}
          path: |
            output/*/song.json
            output/*/song.wav
            output/*/generation-state.json
          retention-days: 7
  images:
    needs: lyrics
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SONG_RUN_ID: ${{ needs.lyrics.outputs.run_id }}
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '4'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      CPU_IMAGE_WIDTH: '1024'
      CPU_IMAGE_HEIGHT: '576'
      CPU_IMAGE_STEPS: '20'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Prepare CPU image memory
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo fallocate -l 12G /swapfile-images
          sudo chmod 600 /swapfile-images
          sudo mkswap /swapfile-images
          sudo swapon /swapfile-images
      - name: Install reference SSD-1B CPU image runtime
        run: |
          pip install --no-cache-dir torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt -r requirements-images-cpu.txt
      - uses: actions/download-artifact@v4
        with:
          name: music-input-${{ github.run_id }}
          path: output/
      - name: Restore previous song artwork when available
        if: inputs.prepared_run != '' && contains(fromJSON(needs.lyrics.outputs.restore_artifacts || '[]'), format('generated-artwork-{0}', inputs.prepared_run))
        uses: actions/download-artifact@v4
        with:
          name: generated-artwork-${{ inputs.prepared_run }}
          run-id: ${{ inputs.prepared_run }}
          github-token: ${{ github.token }}
          path: output/
      - name: Generate unique song background and thumbnail scenes
        run: python -u prepare_music.py --run-id "$SONG_RUN_ID" --stage images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: generated-artwork-${{ github.run_id }}
          path: |
            output/*/background-source.png
            output/*/thumbnail-source.png
            output/*/image-manifest.json
          retention-days: 7
  publish:
    needs: [lyrics, music, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SONG_RUN_ID: ${{ needs.lyrics.outputs.run_id }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: generated-music-${{ github.run_id }}
          path: output/
      - uses: actions/download-artifact@v4
        with:
          name: generated-artwork-${{ github.run_id }}
          path: output/
      - name: Render video on GitHub CPU
        run: python -u prepare_music.py --run-id "$SONG_RUN_ID" --stage render
      - name: Back up to Drive and publish publicly on Heart and Mind
        run: python -u pipeline.py --run-id "$SONG_RUN_ID" --defer-drive-cleanup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-output-${{ github.run_id }}
          path: output/*/*.json
          retention-days: 7
  cleanup:
    name: Clean published media from Drive
    needs: [lyrics, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SONG_RUN_ID: ${{ needs.lyrics.outputs.run_id }}
      YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
      EXPECTED_CHANNEL_ID: ${{ secrets.EXPECTED_CHANNEL_ID }}
      DRIVE_TOKEN_JSON: ${{ secrets.DRIVE_TOKEN_JSON }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify public HD video and clean its temporary media
        run: python -u cleanup_drive.py --run-id "$SONG_RUN_ID"
